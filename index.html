<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5A54">
<meta name="description" content="دفتر المشتريات لمتابعة المصاريف والمشتريات والنثريات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتر المشتريات">
<link rel="stylesheet" href="fonts/fonts.css">
<script>window.LEDGER_STANDALONE = true;</script>
<script src="config.js"></script>
<title>دفتر المشتريات</title>
<style>
/* Layout: one-column phone app — sticky top bar, scrolling content, bottom tab bar, floating add button; sheets slide up for forms */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#E3ECE9; --ink:#14211F; --muted:#5A6B67; --line:#D3DEDA;
  --brand:#0E5A54; --brand-ink:#FFFFFF; --brand-soft:#D8EBE7; --brass:#9C6A16;
  --pending:#A85F00; --pending-bg:#FCEDD3; --paid:#1C7444; --paid-bg:#DAF1E2; --partial:#2A5CA5; --partial-bg:#DFE9F8;
  --danger:#B3261E; --danger-bg:#FBE3E1; --shadow:0 1px 2px rgba(14,40,37,.06),0 4px 14px rgba(14,40,37,.06);
  --f-display:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
  --r:14px; --fk:1; --rpk:1; --rp-font:"IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#152120; --surface-2:#1C2A28; --ink:#E5EEEB; --muted:#93A6A1; --line:#283836;
  --brand:#4DB0A5; --brand-ink:#04201D; --brand-soft:#173936; --brass:#D9A84F;
  --pending:#F0B25A; --pending-bg:#3A2A10; --paid:#6CCB90; --paid-bg:#133022; --partial:#8DB4F2; --partial-bg:#172848;
  --danger:#F28A82; --danger-bg:#3B1714; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#152120; --surface-2:#1C2A28; --ink:#E5EEEB; --muted:#93A6A1; --line:#283836;
  --brand:#4DB0A5; --brand-ink:#04201D; --brand-soft:#173936; --brass:#D9A84F;
  --pending:#F0B25A; --pending-bg:#3A2A10; --paid:#6CCB90; --paid-bg:#133022; --partial:#8DB4F2; --partial-bg:#172848;
  --danger:#F28A82; --danger-bg:#3B1714; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}  /* page wrappers outside Claude don't add this; .progress/.toast/form groups rely on it */
body{margin:0}img{max-width:100%}
html,body{background:var(--bg);overflow-x:hidden;max-width:100%}
.app{overflow-x:clip}
body{color:var(--ink);font-family:var(--f-body);font-size:calc(15px * var(--fk));line-height:1.55;direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px, 1em)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(210px + env(safe-area-inset-bottom,0px))}
.wrap{padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.top h1{font-family:var(--f-display);font-weight:600;font-size:calc(22px * var(--fk));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:calc(12.5px * var(--fk));color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.brandmark{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg{width:24px;height:24px}

/* summary */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px 18px 16px;display:grid;gap:12px}
.hero .lbl{font-size:calc(13px * var(--fk));opacity:.85}
.hero .big{font-family:var(--f-display);font-size:calc(34px * var(--fk));font-weight:600;line-height:1.1}
.hero .big small{font-size:calc(16px * var(--fk));font-family:var(--f-body);font-weight:500;opacity:.85}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid color-mix(in srgb,var(--brand-ink) 22%,transparent);padding-top:12px}
.hero .row b{display:block;font-size:calc(16px * var(--fk));font-weight:600}
.hero .row span{font-size:calc(12px * var(--fk));opacity:.85}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-h h2{font-size:calc(16px * var(--fk));font-weight:700}
.link-btn{background:none;border:0;color:var(--brand);font-weight:600;font-size:calc(14px * var(--fk));padding:6px 4px;display:inline-flex;align-items:center;gap:4px}
.link-btn svg{width:16px;height:16px}

/* project cards */
.plist{display:grid;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;text-align:right;width:100%}
.pcard .t{display:flex;align-items:flex-start;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:8px}
.pcard .name{font-weight:700;font-size:calc(16px * var(--fk))}
.pcard .client{font-size:calc(13px * var(--fk));color:var(--muted)}
.pcard .due{margin-inline-start:auto;text-align:left;flex:none}
.pcard .due b{font-size:calc(17px * var(--fk));display:block;font-weight:700}
.pcard .due span{font-size:calc(11.5px * var(--fk));color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--paid);border-radius:6px}
.pcard .meta{display:flex;justify-content:space-between;font-size:calc(12.5px * var(--fk));color:var(--muted);gap:8px;flex-wrap:wrap}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{font-size:calc(17px * var(--fk))}
.empty p{margin:0;color:var(--muted);font-size:calc(14px * var(--fk));max-width:34ch}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

/* stats tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;min-width:0}
.stat span{font-size:calc(11.5px * var(--fk));color:var(--muted);display:block}
.stat b{font-size:calc(15px * var(--fk));font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.due{background:var(--pending-bg);border-color:transparent}
.stat.due b{color:var(--pending)}
.proj-head{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:4px}
.proj-head>*{min-width:0}
.proj-head .client{color:var(--muted);font-size:calc(13.5px * var(--fk))}

/* search & chips */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;padding:11px 0;flex:1;min-width:0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:calc(13.5px * var(--fk));white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-inline-start:4px}

/* expense rows */
.month{font-size:calc(12.5px * var(--fk));font-weight:700;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between}
.elist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.erow{display:flex;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:right;align-items:center}
.erow:last-child{border-bottom:0}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:20px;height:20px}
.erow .mid{flex:1;min-width:0}
.erow .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .v{font-size:calc(12.5px * var(--fk));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .end{text-align:left;flex:none;display:grid;gap:4px;justify-items:end}
.erow .amt{font-weight:700}
.pill{font-size:calc(11.5px * var(--fk));font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.pending{background:var(--pending-bg);color:var(--pending)}
.pill.paid{background:var(--paid-bg);color:var(--paid)}
.pill.custody{background:var(--brand-soft);color:var(--brand)}
.pill.partial{background:var(--partial-bg);color:var(--partial)}

.custcard{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.custcard .ic{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.custcard .ic svg{width:22px;height:22px}
.custcard .mid{flex:1;min-width:0}
.custcard .mid b{display:block;font-weight:700}
.custcard .mid span{display:block;font-size:calc(12.5px * var(--fk));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.custcard .bal{text-align:left;flex:none}
.custcard .bal b{display:block;font-weight:700;font-size:calc(16px * var(--fk))}
.custcard .bal span{font-size:calc(11.5px * var(--fk));color:var(--muted)}
.custsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.custsum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.custsum .big{grid-column:1/-1;background:var(--brand-soft);border-color:transparent}
.custsum span.num{margin-top:2px}
.custsum span{display:block;font-size:calc(12px * var(--fk));color:var(--muted)}
.custsum b{display:block;font-weight:700;font-size:calc(15px * var(--fk))}
.custsum .big b{font-size:calc(24px * var(--fk))}
.ctag{font-size:calc(11.5px * var(--fk));font-weight:700}
.ctag img{width:100%;height:100%;object-fit:cover}
.ctag.deposit{background:var(--paid-bg);color:var(--paid)}
.ctag.buy{background:var(--pending-bg);color:var(--pending)}
.fsec{font-family:var(--f-display);font-weight:700;font-size:calc(13px * var(--fk));color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
.fgroup{display:grid;gap:16px}
.more{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.more summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--muted);font-size:calc(14px * var(--fk));list-style:none;display:flex;justify-content:space-between}
.more summary::after{content:"+";font-weight:700}
.more[open] summary::after{content:"−"}
.more summary::-webkit-details-marker{display:none}
.more[open]{padding-bottom:12px}
.seg3 button{font-size:calc(12.5px * var(--fk));line-height:1.3;padding:8px 2px}
.ctag.refund{background:var(--danger-bg);color:var(--danger)}
.ctag.reimb{background:var(--partial-bg);color:var(--partial)}
.balcard{display:grid;gap:8px;width:100%;text-align:right;background:var(--brand);color:var(--brand-ink);border:0;border-radius:18px;padding:16px}
.balcard .lbl{font-size:calc(13px * var(--fk));opacity:.85}
.balcard .big{font-family:var(--f-display);font-size:calc(30px * var(--fk));font-weight:700;line-height:1.15}
.balcard .bar.light{background:color-mix(in srgb,var(--brand-ink) 22%,transparent)}
.balcard .bar.light i{background:var(--brand-ink)}
.balcard .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.balcard .row small{display:block;font-size:calc(11.5px * var(--fk));opacity:.8}
.balcard .row b{font-weight:600}
.balcard .go{margin-inline-start:auto;font-size:calc(12.5px * var(--fk));font-weight:600;opacity:.9}
.plancard{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.plancard .ic{width:40px;height:40px;border-radius:11px;background:var(--partial-bg);color:var(--partial);display:grid;place-items:center;flex:none}
.plancard .ic svg{width:22px;height:22px}
.plancard .mid{flex:1;min-width:0}
.plancard .mid b{display:block;font-weight:700}
.plancard .mid span{display:block;font-size:calc(12.5px * var(--fk));color:var(--muted)}
.plancard .bal{text-align:left;flex:none}
.plancard .bal b{display:block;font-weight:700}
.plancard .bal span{font-size:calc(11.5px * var(--fk));color:var(--muted)}
.duebar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;background:var(--pending-bg);color:var(--pending);border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:calc(13.5px * var(--fk))}
.fabs{position:fixed;z-index:25;inset-inline-start:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.fabs .fab{position:static}
.fab{position:fixed;z-index:25;inset-inline-start:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-ink);border:0;border-radius:16px;padding:0 18px;height:54px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 6px 18px rgba(14,90,84,.35)}
.fab svg{width:22px;height:22px}
.fab-in{background:#1C7444!important;color:#fff!important;box-shadow:0 6px 18px rgba(28,116,68,.35)!important;height:46px!important;font-size:calc(14px * var(--fk))}
.fab-out{background:#B3261E!important;color:#fff!important;box-shadow:0 6px 18px rgba(179,38,30,.35)!important}
.fab .minus{font-size:26px;line-height:1;font-weight:700;width:22px;text-align:center}
.btn.in{background:#1C7444;color:#fff}
.btn.out{background:#B3261E;color:#fff}
.money .in,.money .out,.month .in,.month .out{direction:ltr;unicode-bidi:isolate;display:inline-block}
.money .in,.month .in{color:var(--paid)}
.money .out,.month .out{color:var(--danger)}
.runbal{font-size:calc(12px * var(--fk));color:var(--muted)}
.runbal .neg{color:var(--danger)}
.etable .runbal{font-size:calc(14px * var(--fk));color:var(--ink);font-weight:600}
.etable .runbal .same{color:var(--muted);font-weight:400}
.etable tr.k-deposit td{background:color-mix(in srgb,var(--paid-bg) 45%,transparent)}
.etable tr.k-refund td,.etable tr.k-reimb td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:calc(12px * var(--fk));color:var(--muted);font-weight:500}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--brand);font-weight:700}

/* sheets */
.overlay{position:fixed;inset:0;height:100%;height:100dvh;z-index:50;overflow:hidden;background:rgba(5,20,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:calc(100dvh - 20px);min-height:0;overflow:hidden;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;text-align:center;font-size:calc(16px * var(--fk));font-weight:700}
.sheet-head .btn{min-height:38px;padding:8px 14px}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px calc(120px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start;gap:16px}
.sheet-body>*,.card>*{min-width:0}
input[type=date].inp,input[type=datetime-local].inp{min-width:0;max-width:100%;width:100%;display:block;-webkit-appearance:none;appearance:none;min-height:46px;text-align:right}

/* form */
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.field>label,.flabel{font-size:calc(13px * var(--fk));font-weight:600;color:var(--muted)}
.field .hint{font-size:calc(12px * var(--fk));color:var(--muted)}
.inp{font-size:max(16px, calc(15px * var(--fk)));width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:70px}
.amount-box{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.amount-box input{width:100%;border:0;background:none;outline:none;font-size:calc(30px * var(--fk));font-weight:700;flex:1;min-width:0;padding:4px 0;direction:ltr;text-align:right}
.amount-box span{color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:calc(13.5px * var(--fk));font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"][data-v="paid"]{color:var(--paid)}
.seg button[aria-pressed="true"][data-v="pending"]{color:var(--pending)}
.seg button[aria-pressed="true"][data-v="partial"]{color:var(--partial)}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchips .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.attach-row{display:flex;gap:8px;flex-wrap:wrap}
.attach-row .btn{flex:1 1 130px;min-height:42px;font-size:calc(14px * var(--fk))}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.tthumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.tthumb img{width:100%;height:100%;object-fit:cover}

/* The model: the owners deposit a custody amount; expenses are paid from it.
   Sometimes the custodian pays in advance from his own money (a claim) and is reimbursed
   either by the owners (e.g. bank transfer) or by taking it from the custody. */
const STATUS = { pending: 'بانتظار الاسترداد', partial: 'مُسترد جزئيًا', paid: 'تم الاسترداد', custody: 'من الإيداعات' };
const SOURCES = { custody: 'من رصيد الإيداعات', own: 'من حسابي الخاص' };
const srcOf = e => e.source === 'own' ? 'own' : e.source ? 'custody' : 'own';   // legacy 'cash' counts as custody; records without a source are claims
const isFunded = e => srcOf(e) === 'custody';                                    // paid from custody: not a claim
const paidOf = e => isFunded(e) ? 0 : e.status === 'paid' ? (+e.amount || 0) : e.status === 'partial' ? Math.min(+e.paidAmount || 0, +e.amount || 0) : 0;
const custPaidOf = e => isFunded(e) ? 0 : Math.min(+e.custodyPaid || 0, paidOf(e));   // part of a claim reimbursed from custody
const balUse = e => isFunded(e) ? (+e.amount || 0) : custPaidOf(e);                   // what it takes from the custody balance
const statusOf = e => isFunded(e) ? 'custody' : e.status;
function statsOf(list) {
  let total = 0, own = 0, cust = 0, paid = 0, fromCust = 0, pending = 0;
  for (const e of list) { const a = +e.amount || 0; total += a; if (isFunded(e)) { cust += a; continue; } own += a; paid += paidOf(e); fromCust += custPaidOf(e); if (e.status !== 'paid') pending++; }
  return { total, own, cust, paid, fromCust, fromOwner: r2(paid - fromCust), due: r2(Math.max(0, own - paid)), count: list.length, pending };
}
const custOf = pid => S.custody.filter(c => c.projectId === pid && (c.type === 'deposit' || c.type === 'refund'));   // refund = surplus given back to the owners
function custodyBal(pid) {
  let dep = 0, refunded = 0, spent = 0, reimb = 0;
  for (const c of custOf(pid)) { if (c.type === 'refund') refunded += +c.amount || 0; else dep += +c.amount || 0; }
  for (const e of expOf(pid)) { if (isFunded(e)) spent += +e.amount || 0; else reimb += custPaidOf(e); }
  return { dep, refunded, spent, reimb, bal: r2(dep - refunded - spent - reimb), has: custOf(pid).some(c => c.type === 'deposit') };
}
const dayName = d => fmt('gregory', { weekday: 'long' }, d);
const expOf = pid => S.expenses.filter(e => e.projectId === pid);

  const open = plansOf(pid).filter(x => !x.done);

}
function projectLedger(pid) {
  const rows = [];

    if (custPaidOf(e)) rows.push({ kind: 'reimb', id: e.id, dt: (e.paidDate || (e.datetime || todayStr()).slice(0, 10)) + 'T23:59', amt: custPaidOf(e), sign: -1, bal: -custPaidOf(e), rec: e });

}
const TITLE_TPL = 'تقرير مصاريف من إيداعات {المشروع}';

const reportTitleFor = p => (p && p.reportTitle) || ((S.settings.reportTitle || TITLE_TPL).includes('{المشروع}') ? (S.settings.reportTitle || TITLE_TPL) : TITLE_TPL).replace('{المشروع}', (p && p.name) || '');

/* ---------- storage ---------- */
const Store = {
  mode: 'local', db: null, assets: null, downloads: null, base: null, chains: {},
  async init() {
    if (STANDALONE) return this.initStandalone();
    let db = null, user = null, assets = null, downloads = null;
    if (window.claude && typeof claude.use === 'function') {

    }

  listen(waitMs) {

        const n = { ...DEFAULT_SETTINGS, ...(s.exists ? s.data() : {}) };
        if (got.s && (SettingsSync.busy() || (s.metadata && s.metadata.hasPendingWrites) || canon(n) === canon(S.settings))) return;
        if (this.fb && !got.s && (SettingsSync.busy() || canon(n) === canon(S.settings))) { done('s'); return; }
        S.settings = n; for (const k in fmtCache) delete fmtCache[k]; applyTheme(); if (this.fb) this.persistLocal(); if (live('s')) softRender(); done('s');
      }, onErr('s'));

        if (this.fb && !got[k] && canon(byId(n)) === canon(byId(S[name]))) { done(k); return; }
        S[name] = n; if (this.fb) this.persistLocal(); if (live(k)) softRender(); done(k);
      }, onErr(k));

      setTimeout(res, waitMs);
    });
  },
  /* outside Claude: data lives on this device (IndexedDB) and, once signed in, syncs through the user's own Firebase project */
  async initStandalone() {
    try { await IDB.open(); const st = await IDB.get('state'); if (st) { S.settings = { ...DEFAULT_SETTINGS, ...st.settings }; S.projects = st.projects || []; S.expenses = st.expenses || []; S.custody = st.custody || []; S.plans = st.plans || []; } }
    catch (e) { console.warn(e); this.mode = 'memory'; return; }

    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    const cfg = FB.config(); if (!cfg) return;
    try { await FB.start(cfg); } catch (e) { console.warn('firebase', e); FB.error = e; return; }
    if (!FB.user) return;
    this.mode = 'cloud'; this.fb = true; this.db = FB.db; this.base = FB.db.doc(`users/${FB.user.uid}`);
    this.trackPending(this.db.waitForPendingWrites());
    const hasLocal = S.projects.length || S.expenses.length;
    await this.listen(hasLocal ? 0 : 6000);
    setTimeout(() => FB.afterStart(), 1500);
  },
  pending: 0,
  trackPending(p) { this.pending++; drawSync(); Promise.resolve(p).catch(() => {}).finally(() => { this.pending--; drawSync(); }); },
  /* one write path: Claude's store is awaited and retried in order; Firestore applies writes locally at once and queues them while offline,
     so its promise (which only settles when the server confirms) is tracked for the sync badge but never awaited */
  wr(key, fn) {

  persistLocal() { if (this.mode === 'cloud' && !this.fb) return; if (!IDB.db) return; clearTimeout(this._t); this._t = setTimeout(() => IDB.set('state', S).catch(() => toast('تعذّر الحفظ على هذا الجهاز')), 250); },
  async putProject(p) {
    const i = S.projects.findIndex(x => x.id === p.id); if (i >= 0) S.projects[i] = p; else S.projects.push(p);
    if (this.mode === 'cloud') return this.wr('p' + p.id, () => this.base.collection('projects').doc(p.id).set(p)).catch(dbFail);
    this.persistLocal();

  async delProject(id) {

      for (const x of pl) await this.wr('xl' + x.id, () => this.base.collection('plans').doc(x.id).delete()).catch(() => {});

  async putExpense(e) {

    if (this.mode === 'cloud') return this.wr('e' + e.id, () => this.base.collection('expenses').doc(e.id).set(e)).catch(dbFail);

  async delExpense(e, keep) {

  if (d.kind === 'exp') { expenseForm(r, r.projectId, { isNew: d.st.isNew }); F.fresh = d.st.fresh || []; }
  else { custodyForm(r.projectId, r.type, r, { isNew: d.st.isNew }); CF.fresh = d.st.fresh || []; }
  for (const [id, v] of Object.entries(d.vals || {})) { const el = id.startsWith('_') ? null : $('#sheetRoot #' + id); if (!el) continue; if (el.type === 'checkbox') el.checked = v; else el.value = v; }
  const pm = !!(d.vals || {})._pm; $('#eAmPm')?.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.v === 'pm') === pm));
  dateHint(); if (d.kind === 'exp') { drawAttach(); custHint(); }
  G.sig = '';                                                                        // restored data counts as unsaved
}
async function offerDraft() {
  let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch {}
  if (!d || !d.st || Date.now() - d.at > 14 * 864e5) return;
  const what = d.kind === 'exp' ? 'عملية شراء أو صرف' : 'حركة إيداع';
  const r = await choiceBox('لديك عملية لم تُحفظ', `${what} بدأت تسجيلها ولم تُحفظ. هل تريد استكمالها؟`, [['open', 'استكمال وحفظ', 'primary'], ['drop', 'تجاهلها', 'ghost']]);
  if (r === 'open') restoreDraft(d);
  else if (r === 'drop') { for (const ref of (d.st.fresh || [])) Store.dropRef(ref); clearDraft(); }
}

document.addEventListener('click', ev => { if (G && ev.target.closest && ev.target.closest('#sheetRoot')) draftSoon(); }, true);
function openSheet(title, body, { right = '', left = '<button class="btn ghost" data-a="close">إغلاق</button>' } = {}) {

  document.body.style.overflow = 'hidden';
}
function closeSheet() { if (F && F.fresh) for (const r of F.fresh) Store.dropRef(r); if (CF && CF.fresh) for (const r of CF.fresh) Store.dropRef(r); F = null; CF = null; PF = null; G = null; clearDraft(); $('#sheetRoot').innerHTML = ''; document.body.style.overflow = ''; }

function render() {

  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === U.tab ? 'page' : 'false'));
  if (U.tab === 'home' && U.projectId && proj(U.projectId)) app.innerHTML = viewProject();

  const statusKey = r => r.kind === 'exp' ? statusOf(r.rec) : r.kind === 'reimb' ? 'reimb' : 'deposit';
  const counts = { all: all.length, deposit: 0, custody: 0, pending: 0, partial: 0, paid: 0 };
  for (const r of all) { const k = statusKey(r); if (k in counts) counts[k]++; }
  const q = U.q.trim().toLowerCase();
  const text = r => r.kind === 'exp' ? [r.rec.description, r.rec.vendor, r.rec.category, r.rec.reason, r.rec.method, r.rec.invoiceNo, r.rec.notes] : r.kind === 'reimb' ? [r.rec.description, 'استرداد'] : [r.rec.by, r.rec.method, r.rec.ref, r.rec.notes, 'إيداع'];
  const shown = all.filter(r => (U.filter === 'all' || statusKey(r) === U.filter) && (!q || text(r).join(' ').toLowerCase().includes(q)));

  const info = r => {   // title, sub line, pill, action
    if (r.kind === 'deposit') return { t: `إيداع${r.rec.by ? ' من ' + r.rec.by : ''}`, sub: [r.rec.method, r.rec.ref && 'مرجع ' + r.rec.ref].filter(Boolean).join(' · '), pill: '<span class="pill paid">إيداع</span>', a: 'cust-edit', cat: '—', vendor: '—', method: r.rec.method || '' };
    if (r.kind === 'refund') return { t: `إعادة فائض${r.rec.by ? ' إلى ' + r.rec.by : ' للملاك'}`, sub: r.rec.method || '', pill: '<span class="pill pending">إعادة للملاك</span>', a: 'cust-edit', cat: '—', vendor: '—', method: r.rec.method || '' };

  const card = r => { const x = info(r); const ph = r.kind === 'exp' ? ((r.rec.photos || [])[0] || (r.rec.invoice && r.rec.invoice.t === 'img' ? r.rec.invoice : null)) : null;
    return `<button class="erow" data-a="${x.a}" data-id="${r.id}"><span class="thumb ${r.kind === 'exp' ? '' : 'ctag ' + (r.kind === 'reimb' ? 'reimb' : r.kind)}">${ph ? `<img src="${esc(src(ph))}" alt="" loading="lazy">` : r.kind === 'exp' ? I.bag : r.kind === 'deposit' ? 'إيداع' : r.kind === 'refund' ? 'إعادة' : 'استرداد'}</span>
      <span class="mid"><span class="d" style="display:block">${esc(x.t)}</span>${x.sub ? `<span class="v" style="display:block">${esc(x.sub)}</span>` : ''}<span class="v num" style="display:block">${dateLine(r.dt)}</span></span>
      <span class="end"><span class="amt num money">${amtHtml(r)}</span>${x.pill}<span class="runbal num">الرصيد ${runHtml(r)}</span></span></button>`; };
  const trow = r => { const x = info(r); const d = toDate(r.dt); const nAtt = r.kind === 'exp' ? (r.rec.photos || []).length + (r.rec.invoice ? 1 : 0) : (r.rec.doc ? 1 : 0);
    return `<tr data-a="${x.a}" data-id="${r.id}" tabindex="0" class="${r.kind === 'exp' ? '' : 'k-' + r.kind}"><td class="num nowrap">${gDate(d)} م<small>${S.settings.dateMode === 'greg' ? '' : hShort(d) + (r.kind === 'reimb' ? '' : ' · ')}${r.kind === 'reimb' ? '' : tTime(d)}</small></td>

async function saveProject(id) {
  const name = $('#pName').value.trim(); if (!name) { $('#pName').focus(); toast('اكتب اسم المشروع'); return; }
  const old = id ? proj(id) : null;
  const p = { ...(old || { id: newId('p'), createdAt: new Date().toISOString(), archived: false }), name, client: $('#pClient').value.trim(), clientPhone: $('#pClientPhone').value.trim(), budget: normNum($('#pBudget').value) || 0, notes: $('#pNotes').value.trim(), reportTitle: $('#pRTitle').value.trim(), color: $('#pColors [aria-pressed="true"]')?.dataset.c || COLORS[0] };
  closeSheet(); await Store.putProject(p);
  if (!old && U.tab === 'home') U.projectId = p.id;
  render(); toast(old ? 'حُفظ المشروع' : 'أُنشئ المشروع');
  return true;
}

/* ---------- custody ---------- */
function custodyLedger(pid) {
  /* every movement of the custody, oldest first, with the running balance */
  const rows = [];
  for (const c of custOf(pid)) rows.push({ kind: c.type, dt: c.datetime, amt: c.type === 'refund' ? -c.amount : +c.amount, title: c.type === 'refund' ? `إعادة فائض${c.by ? ' إلى ' + c.by : ' للملاك'}` : `إيداع${c.by ? ' من ' + c.by : ''}`, sub: [c.method, c.ref && 'مرجع ' + c.ref, c.doc && '📎 سند مرفق', c.notes].filter(Boolean).join(' · '), id: c.id, a: 'cust-edit', doc: c.doc });
  for (const e of expOf(pid)) {
    if (isFunded(e)) rows.push({ kind: 'buy', dt: e.datetime, amt: -e.amount, title: e.description || 'صرف', sub: [e.vendor, e.method].filter(Boolean).join(' · '), id: e.id, a: 'open-exp' });
    else if (custPaidOf(e)) rows.push({ kind: 'reimb', dt: (e.paidDate || (e.datetime || todayStr()).slice(0, 10)) + 'T12:00', amt: -custPaidOf(e), title: `استرداد لك عن: ${e.description}`, sub: `دفعتها من حسابك ${money(e.amount)}`, id: e.id, a: 'open-exp', dateOnly: true });
  }
  const key = r => (r.dt || '').slice(0, 10) + (r.kind === 'deposit' ? '0' : '1') + (r.dt || '').slice(10);   // same day: deposits first
  rows.sort((a, b) => key(a).localeCompare(key(b)));
  let run = 0; for (const r of rows) { run = r2(run + r.amt); r.run = run; }
  return rows.reverse();
}

async function fullBackup() {

    const items = fileItems(); const pn = id => (S.projects.find(p => p.id === id) || {}).name || 'بدون مشروع';

async function pdfFirstPage(file) {
  const base = 'lib/';
  await loadScript(base + 'pdf.worker.min.js'); await loadScript(base + 'pdf.min.js');
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const page = await pdf.getPage(1); const v1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: 1800 / Math.max(v1.width, v1.height) });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: x, viewport: vp }).promise;
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
}

function verifyCode(claimNo, items, st) {
  const str = claimNo + '|' + items.map(e => [e.id, e.amount, e.status, e.datetime].join(',')).join(';') + '|' + st.total.toFixed(2);
  let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  const hex = (h >>> 0).toString(16).toUpperCase().padStart(8, '0');
  return hex.slice(0, 4) + '-' + hex.slice(4);
}

function initSigPad() {
  const c = $('#sigPad'); if (!c) return; const r = c.getBoundingClientRect(); const k = 2;
  c.width = r.width * k; c.height = r.height * k; sigCtx = c.getContext('2d'); sigCtx.scale(k, k); sigCtx.lineWidth = 2.4; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round'; sigCtx.strokeStyle = '#10213F'; sigDirty = false;
  let drawing = false;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); sigCtx.beginPath(); sigCtx.moveTo(x, y); };
  c.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); sigCtx.lineTo(x, y); sigCtx.stroke(); sigDirty = true; };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
}

    case 'sync-check': { busyBtn('[data-a="sync-check"]', true, 'جارٍ الفحص'); try { const n = await Files.reconcile(true); toast(n ? `أُعيد رفع ${iFmt(n)} مرفق` : navigator.onLine ? 'كل المرفقات موجودة في حسابك' : 'لا يوجد اتصال بالإنترنت'); } finally { busyBtn('[data-a="sync-check"]', false); } break; }
    case 'restore': $('#fBackup').click(); break;
    case 'wipe': if (await confirmBox('حذف جميع البيانات؟', 'ستُحذف كل المشاريع والعمليات والمرفقات والإعدادات نهائيًا. خذ نسخة احتياطية أولًا إن احتجت.', 'حذف الكل', true)) {
      for (const p of [...S.projects]) await Store.delProject(p.id);

      for (const c of [...S.custody]) await Store.delCustody(c);
      for (const x of [...S.plans]) await Store.delPlan(x);
      S.settings = { ...DEFAULT_SETTINGS }; await Store.putSettings(); applyTheme(); U.projectId = null; render(); toast('حُذفت جميع البيانات'); } break;
  }
});
